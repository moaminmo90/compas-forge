[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "compas-forge"
version = "0.1.0"
description = "High-performance pre-flight validation and geometry QA engine for COMPAS framework"
requires-python = ">=3.10"
authors = [
    { name = "AEC Systems Developer", email = "research@compas-forge.org" }
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.7.0"
]

[project.scripts]
compas-forge = "compas_forge.cli:main"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "compas_forge._core"